server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;

    # Defaut nginx (1M) trop bas pour l'import manuel d'un export Xpeng
    # (my-vehicle.xpeng.importer) : cette limite est locale a ce conteneur,
    # distincte du client_max_body_size du nginx de l'hote.
    client_max_body_size 100M;

    # L'inventaire des paquets depasse le mega-octet en HTML : sans compression
    # la page est inutilisable sur une connexion lente. Profite a tout le reste.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # 300s : le plus gros import Xpeng vu a ce jour (un mois complet)
        # a pris ~2min09s en CLI ; de la marge pour un futur export plus long.
        fastcgi_read_timeout 300;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
