server {
    server_name s.lolinux.fr;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Domaine entierement public, dedie aux liens de partage de position
    # (App\Http\Middleware\IdentifyUser::PUBLIC_ROUTES contient
    # position-shares.show). Pas d'auth_request ici, contrairement a
    # ev.lolinux.org : la protection est le token lui-meme, genere
    # aleatoirement et jamais devinable — exactement celle d'un lien de
    # partage classique. Voir docker/share/README.md.
    location / {
        # A vide, et c'est le point critique : sans cette ligne nginx
        # transmettrait l'en-tete tel que le client l'a envoye, ouvrant une
        # usurpation d'identite applicative. Meme regle que /infoCar sur
        # ev.lolinux.org (docker/gate/gate.conf).
        proxy_set_header X-SSO-Email "";

        proxy_pass http://127.0.0.1:8098;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/s.lolinux.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/s.lolinux.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = s.lolinux.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name s.lolinux.fr;
    return 404; # managed by Certbot


}