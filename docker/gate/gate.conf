server {
    listen 80;
    server_name _;
    server_tokens off;

    add_header Strict-Transport-Security max-age=31536000 always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10M;

    location = /_sso_check {
        internal;
        proxy_pass http://passkey/api/sso-check.php;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @sso_redirect {
        return 302 https://pk.lolinux.org/login.php?redirect=https%3A%2F%2Fev.lolinux.org%2F;
    }

    location @forbidden {
        internal;
        default_type text/plain;
        return 403 "Ce compte n'est pas autorise sur ev.lolinux.org.\n";
    }

    # Seule adresse ouverte sans passkey : l'etat du vehicule, pour le
    # navigateur embarque de la voiture, ou une ceremonie passkey n'a pas sa
    # place. Expression insensible a la casse, un clavier de voiture etant ce
    # qu'il est.
    #
    # X-SSO-Email force a vide, et c'est le point critique : sans cette ligne,
    # nginx transmettrait l'en-tete tel que le client l'a envoye, et n'importe
    # qui pourrait se declarer proprietaire du compte sur cette adresse. Le
    # `proxy_set_header` de la location voisine n'existe que pour cette raison.
    location ~* ^/infocar/?$ {
        # La casse est normalisee ici : le routage de Laravel la distingue, et
        # un clavier de voiture met volontiers une majuscule au premier mot.
        # L'application ne connait donc qu'une seule adresse.
        rewrite ^ /infoCar break;

        proxy_set_header X-SSO-Email "";

        proxy_pass http://ev-nginx;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;

        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Toujours du passkey ici, pas de bypass IP.
    #
    # L'application est ouverte a tous les passkeys enregistres depuis qu'elle
    # cloisonne les donnees par compte : c'est elle qui separe, plus la
    # passerelle qui filtre sur un email unique.
    location / {
        auth_request /_sso_check;
        error_page 401 = @sso_redirect;
        error_page 403 = @forbidden;

        # Identite de la session SSO, transmise a l'application. `proxy_set_header`
        # ecrase systematiquement ce qu'un client aurait pu envoyer : l'en-tete
        # n'est pas falsifiable de l'exterieur.
        auth_request_set $sso_email $upstream_http_x_sso_email;
        proxy_set_header X-SSO-Email $sso_email;

        proxy_pass http://ev-nginx;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }
}
